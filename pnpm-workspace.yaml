packages:
  - apps/*
  - packages/*

# Все внешние зависимости — только отсюда (`catalog:` в package.json пакетов), версии точные,
# без beta/rc (ADR-001, ADR-002). Обновлять осознанно, одним коммитом с причиной.
catalog:
  # язык и инструменты
  typescript: 7.0.2
  '@types/node': 22.20.5
  '@biomejs/biome': 2.5.15
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3
  '@playwright/test': 1.64.0
  tsx: 4.23.15
  tsup: 8.5.1

  # общие
  zod: 4.6.5

  # api
  fastify: 5.12.5
  fastify-type-provider-zod: 7.0.0
  '@fastify/swagger': 9.9.2
  openapi-types: 12.1.3
  pino: 10.4.0
  '@node-rs/argon2': 2.2.1

  # db
  pg: 8.23.1
  '@types/pg': 8.23.1
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11

  # web и gate
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  '@tanstack/react-router': 1.170.42
  '@tanstack/router-plugin': 1.168.43
  uqr: 0.1.3

  # ui (этап 6a): Tailwind 4, компоненты в духе shadcn на Radix, формы, запросы, время, перетаскивание
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@radix-ui/react-dialog': 1.3.0
  '@radix-ui/react-slot': 1.5.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.55.0
  '@tanstack/react-query': 5.104.2
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.1
  date-fns: 4.4.0
  '@date-fns/tz': 1.5.0
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/sortable': 10.0.0
  '@dnd-kit/utilities': 3.2.2
  # чтение .xlsx в браузере и запись выгрузки .xlsx на сервере: zip без тяжёлой библиотеки таблиц (этапы 7b, 7b.1)
  fflate: 0.8.3
  # компонентные тесты
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@testing-library/jest-dom': 7.0.1
  jsdom: 29.1.1

# pnpm 10 не запускает postinstall-скрипты без разрешения: только эти пакеты и только нужные.
onlyBuiltDependencies:
  - esbuild
